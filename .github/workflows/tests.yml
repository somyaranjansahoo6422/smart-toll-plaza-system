name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "streamlit>=1.50" "pandas>=2.2"
      - name: Check every Python file compiles
        run: python -m compileall -q app.py auth.py database.py app_pages tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
