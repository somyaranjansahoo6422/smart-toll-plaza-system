# Copy to .streamlit/secrets.toml (git-ignored) to replace the built-in demo accounts.
# Generate a hash with:
#   py -c "import secrets; from auth import hash_token; s = secrets.token_hex(16); print(s, hash_token('YOUR_TOKEN', s))"

